[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-attribute-alignment"
version = "0.1.0"
description = "Exposure-preserving Real/Fake attribute alignment through batch selection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Batch Attribute Alignment contributors"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
images = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8", "build>=1", "twine>=5"]

[project.scripts]
batchalign = "batchalign.cli:main"

[project.urls]
Repository = "https://github.com/nuozimiaowu/batch-attribute-alignment"
Issues = "https://github.com/nuozimiaowu/batch-attribute-alignment/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
